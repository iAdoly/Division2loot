name: Diagnose target_looted

on:
  push:
    paths:
      - ".github/workflows/diag_target_looted.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect target_looted page and scripts
        run: |
          python - <<'PY'
          import re, requests, urllib.parse

          page_url = "https://hi-dep.github.io/division2/?view=target_looted&lang=en"
          headers = {"User-Agent": "Mozilla/5.0", "Cache-Control": "no-cache", "Pragma": "no-cache"}

          html = requests.get(page_url, headers=headers, timeout=30).text
          print("PAGE_LEN", len(html))
          print("HAS_TARGET_LOOTED", "target_looted" in html)

          scripts = re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', html, flags=re.I)
          print("SCRIPTS", scripts)

          base = "https://hi-dep.github.io/division2/"
          for src in scripts:
              url = urllib.parse.urljoin(base, src)
              try:
                  text = requests.get(url, headers=headers, timeout=30).text
              except Exception as e:
                  print("SCRIPT_ERROR", url, repr(e))
                  continue

              if "target_looted" in text or "target_loot" in text or "/data/" in text:
                  print("\nSCRIPT_MATCH", url)
                  for pat in (
                      r'["\']([^"\']*target[^"\']*\.json[^"\']*)["\']',
                      r'["\']([^"\']*/data/[^"\']+\.json[^"\']*)["\']',
                      r'fetch\(([^\)]+)\)',
                  ):
                      for m in re.findall(pat, text, flags=re.I)[:100]:
                          print("MATCH", m)

                  for keyword in ("target_looted", "target_loot", "event/index.json"):
                      pos = text.find(keyword)
                      if pos >= 0:
                          print("CONTEXT", keyword, text[max(0,pos-800):pos+1500])
          PY