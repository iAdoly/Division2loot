name: Diagnose target_looted

on:
  push:
    paths:
      - ".github/workflows/diag_target_looted.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect latest target_looted gzip
        run: |
          python - <<'PY'
          import gzip, io, json, requests, time

          url = "https://hi-dep.github.io/division2/data/target_looted/target_looted_latest.json.gz"
          r = requests.get(
              url,
              params={"ts": int(time.time())},
              headers={"User-Agent": "Mozilla/5.0", "Cache-Control":"no-cache", "Pragma":"no-cache"},
              timeout=30,
          )
          r.raise_for_status()
          raw = gzip.GzipFile(fileobj=io.BytesIO(r.content)).read()
          data = json.loads(raw.decode("utf-8"))

          print("TOP_KEYS", list(data.keys()))
          print("META", json.dumps(data.get("meta", {}), ensure_ascii=False, indent=2))

          events = data.get("events", {})
          print("EVENT_KEYS", list(events.keys()) if isinstance(events, dict) else type(events).__name__)

          esc = events.get("Escalation") if isinstance(events, dict) else None
          print("ESCALATION", json.dumps(esc, ensure_ascii=False, indent=2)[:30000])
          PY
