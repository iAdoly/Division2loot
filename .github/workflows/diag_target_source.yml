name: Diagnose target source

on:
  push:
    paths:
      - ".github/workflows/diag_target_source.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect event.js merge logic and current data
        run: |
          python - <<'PY'
          import gzip, io, json, re, requests, time

          H={"User-Agent":"Mozilla/5.0","Cache-Control":"no-cache","Pragma":"no-cache"}

          js=requests.get("https://hi-dep.github.io/division2/event.js",headers=H,timeout=30).text
          for name in [
              "loadTargetLootedDb",
              "loadEventIndexJson",
              "mergeTargetLootedEvents",
              "loadTargetLootedData",
              "renderTargetLooted",
          ]:
              p=js.find("function "+name)
              if p < 0:
                  p=js.find("async function "+name)
              print("\n===== FUNCTION",name,"POS",p,"=====")
              if p >= 0:
                  print(js[p:p+7000])

          url="https://hi-dep.github.io/division2/data/target_looted/target_looted_latest.json.gz"
          rg=requests.get(url,params={"ts":int(time.time())},headers=H,timeout=30)
          rg.raise_for_status()
          gz=json.loads(gzip.GzipFile(fileobj=io.BytesIO(rg.content)).read().decode("utf-8"))

          idx=requests.get(
              "https://hi-dep.github.io/division2/data/event/index.json",
              params={"ts":int(time.time())},
              headers=H,timeout=30
          ).json()

          print("\n===== GZIP META =====")
          print(json.dumps(gz.get("meta",{}),ensure_ascii=False,indent=2))
          print("\n===== GZIP ESCALATION =====")
          print(json.dumps(gz.get("events",{}).get("Escalation"),ensure_ascii=False,indent=2)[:25000])
          print("\n===== INDEX ESCALATION =====")
          print(json.dumps(idx.get("Escalation"),ensure_ascii=False,indent=2)[:25000])
          PY