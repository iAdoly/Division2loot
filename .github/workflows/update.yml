name: Division 2 Discord Updater

on:
  workflow_dispatch:
  repository_dispatch:
    types: [cron_job_org]

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install -r requirements.txt

      - name: Post Escalation Target Loot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python division2_discord.py
