name: Division 2 Discord Updater

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force post current data"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [cron_job_org]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install lightweight dependencies
        run: python -m pip install requests

      - name: Post daily Escalation
        if: github.event_name == 'repository_dispatch'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python division2_discord.py --event-only --force-event --debug

      - name: Manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python division2_discord.py --force --debug
          else
            python division2_discord.py --debug
          fi

      - name: Save state
        if: always()
        run: |
          if git diff --quiet -- state.json; then
            echo "No state changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update Division 2 bot state"
          git push

